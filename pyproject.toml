[project]
name = "market-overview"
version = "0.1.0"
description = "Builds the daily Market Brief — a silent, bilingual, ≤3 min Indian-market video."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # BSE sits behind Akamai: plain `requests` gets 403, this does not. The only reason the
    # tool has a dependency at all — TradingView is plain `urllib`.
    "curl_cffi>=0.15",
]

[project.optional-dependencies]
# ⚠️ **Optional, so a build-only install stays at one dependency.** `mo build` never imports these — only
# `mo publish` does — and `publish.py` raises a refusal naming this extra rather than failing on an ImportError.
publish = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
# The long form is the product's name; `mo` is the short one you actually type.
market-overview = "market_overview.cli:main"
mo = "market_overview.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_overview"]

[tool.pytest.ini_options]
# ⚠️ **Named, not inferred — and this is the only line the nested project cost this one.**
# `market-overview/src/song-video/` is a *separate* uv project with its own environment, so a bare `pytest` here
# walked into its tests and died importing a package this environment does not have. Ownership is now
# explicit: this suite owns `tests/`, and the reel's suite runs from its own folder
# (`cd song-video && uv run pytest`). Nothing else about the brief changes.
testpaths = ["tests"]


[dependency-groups]
# ⚠️ The publisher's libraries appear here as well as in the extra above, so the **tests** can drive the uploader
# against a stub. The suite stays hermetic — nothing in it reaches the network — but it is not *dependency*-free,
# and pretending otherwise would mean the uploader, the one step that cannot be tidied up afterwards, had no tests.
dev = [
    "pytest",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]
