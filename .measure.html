<script>
const RUNS = [{"key": "bn:disclosure.line", "text": "শিক্ষামূলক তথ্য · কোনো বিনিয়োগ পরামর্শ বা সুপারিশ নয় · শেয়ার বাজারে বিনিয়োগে ঝুঁকি আছে", "size": 44, "weight": 400, "width": 1600}, {"key": "bn:cold_open.heading", "text": "নিফটি ৫০ · 2026-10-12", "size": 40, "weight": 400, "width": 1600}, {"key": "bn:close.as_on", "text": "সেশন · 2026-10-12", "size": 40, "weight": 400, "width": 1728}, {"key": "bn:close.thanks", "text": "ধন্যবাদ", "size": 76, "weight": 400, "width": 1728}, {"key": "bn:close.tomorrow", "text": "আগামীকাল →", "size": 34, "weight": 400, "width": 1728}, {"key": "en:disclosure.line", "text": "Educational only · Not investment advice or a recommendation · Investments in securities markets are subject to risk", "size": 44, "weight": 400, "width": 1600}, {"key": "en:cold_open.heading", "text": "Nifty 50 · 2026-10-12", "size": 40, "weight": 400, "width": 1600}, {"key": "en:close.as_on", "text": "Session · 2026-10-12", "size": 40, "weight": 400, "width": 1728}, {"key": "en:close.thanks", "text": "Thank you", "size": 76, "weight": 400, "width": 1728}, {"key": "en:close.tomorrow", "text": "Tomorrow →", "size": 34, "weight": 400, "width": 1728}];
const FAMILY = "Noto Sans Bengali";
const WEIGHTS = [400, 600, 700];
// ⚠️ The measurement must **wait for the face**, or it measures whichever fallback the browser reached for
// first — the exact defect this harness exists to catch, arriving as a plausible number instead of an error.
// The text handed to `fonts.load` is the copy itself, so the subsets the brief needs are the ones that load.
const TEXT = RUNS.map((r) => r.text).join('');
const ready = Promise.all(WEIGHTS.map((w) => document.fonts.load(`${w} 64px ${FAMILY}`, TEXT)));
(async () => {
await ready;
const ctx = document.createElement('canvas').getContext('2d');
const width = (t, s, w) => { ctx.font = `${w} ${s}px ${FAMILY}`; return ctx.measureText(t).width; };
// Greedy wrap at the real box, with the browser's own metrics — an estimate would be exactly the thing
// this harness exists to avoid.
const lines = (t, s, w, box) => {
  ctx.font = `${w} ${s}px ${FAMILY}`;
  if (ctx.measureText(t).width <= box) return 1;
  let count = 1, line = '';
  for (const word of t.split(/\s+/)) {
    const next = line ? line + ' ' + word : word;
    if (line && ctx.measureText(next).width > box) { count += 1; line = word; }
    else { line = next; }
  }
  return count;
};
const out = RUNS.map(r => ({
  key: r.key,
  width: width(r.text, r.size, r.weight),
  lines: lines(r.text, r.size, r.weight, r.width),
  box: r.width,
}));
document.getElementById('out').textContent = 'RESULT' + JSON.stringify(out) + 'END';
})().catch((error) => {
  document.getElementById('out').textContent = 'FONT-ERROR' + error + 'END';
});
